
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X Visitor Monitor</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10131b;color:#f4f5f8;font-family:Arial,sans-serif;padding:22px}
main{max-width:760px;margin:auto}
h1{font-size:26px}
p{color:#9da6b7;line-height:1.6}
.card{background:#1b2130;border:1px solid #30394d;border-radius:15px;padding:18px;margin:16px 0}
input,button{width:100%;padding:13px;border-radius:9px;border:1px solid #39445a;background:#111725;color:white;margin-top:9px;font-size:15px}
button{background:#527cff;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#30394d}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:#252e40;border-radius:12px;padding:15px}
.num{font-size:25px;font-weight:bold;margin-top:8px}
.item{border-bottom:1px solid #30394d;padding:12px 0;overflow-wrap:anywhere}
small{color:#9da6b7}
a{color:#8eafff}
</style>
</head>
<body>
<main>
<h1> X Visitor Monitor</h1>
<p>专属链接访问监测面板。记录真实点击，不将点击者冒充为 X 帖子浏览者。</p>

<div class="card">
<h3>创建监测链接</h3>
<input id="post" placeholder="输入 X 帖子链接">
<input id="label" placeholder="备注，例如 Post 01">
<button onclick="createLink()">生成监测链接</button>
<div id="generated"></div>
</div>

<div class="stats">
<div class="stat"><small>总访问次数</small><div class="num" id="total">0</div></div>
<div class="stat"><small>不同浏览器标识</small><div class="num" id="unique">0</div></div>
</div>

<div class="card">
<h3>访问记录</h3>
<div id="records">暂无访问记录</div>
<button class="secondary" onclick="exportData()">导出 CSV</button>
<button class="secondary" onclick="clearData()">清空本地记录</button>
</div>

<div class="card">
<h3>说明</h3>
<p>访问者通过你的专属链接进入时，页面会记录时间、浏览器、设备类型和来源。数据保存在当前浏览器中。</p>
<p>不会获取访问者的 X 用户名、头像或真实身份，也无法统计没有点击链接的帖子浏览者。</p>
</div>
</main>

<script>
const KEY="x_monitor_records_v1";
function getRecords(){
 try{return JSON.parse(localStorage.getItem(KEY)||"[]")}
 catch(e){return []}
}
function saveRecords(data){
 localStorage.setItem(KEY,JSON.stringify(data));
}
function device(){
 const ua=navigator.userAgent;
 if(/iPhone|Android|Mobile/i.test(ua))return "Mobile";
 if(/iPad|Tablet/i.test(ua))return "Tablet";
 return "Desktop";
}
function createLink(){
 const post=document.getElementById("post").value.trim();
 const label=document.getElementById("label").value.trim()||"未命名帖子";
 if(!/^https:\/\/(www\.)?(x\.com|twitter\.com)\//i.test(post)){
  alert("请输入有效的 X 帖子链接");
  return;
 }
 const url=new URL(location.href);
 url.searchParams.set("monitor",encodeURIComponent(label));
 url.searchParams.set("post",post);
 document.getElementById("generated").innerHTML=
  '<div class="item">监测链接：<br><a href="'+
  url.href.replace(/&/g,"&amp;")+'">'+
  url.href+'</a></div>';
}
function track(){
 const params=new URLSearchParams(location.search);
 if(!params.has("monitor"))return;
 const records=getRecords();
 const id=crypto.randomUUID?crypto.randomUUID():
  String(Date.now())+Math.random();
 records.push({
  id:id,
  label:params.get("monitor"),
  post:params.get("post")||"",
  time:new Date().toISOString(),
  device:device(),
  browser:navigator.userAgent,
  referrer:document.referrer||"Direct",
  visitorKey:getVisitorKey()
 });
 saveRecords(records);
 document.body.innerHTML=
 '<main><div class="card"><h2>正在打开原帖…</h2>'+
 '<p>访问记录已保存。</p>'+
 '<a href="'+encodeURI(params.get("post")||"https://x.com")+
 '">点击前往 X</a></div></main>';
}
function getVisitorKey(){
 let key=localStorage.getItem("monitor_visitor_key");
 if(!key){
  key=crypto.randomUUID?crypto.randomUUID():
   String(Date.now())+Math.random();
  localStorage.setItem("monitor_visitor_key",key);
 }
 return key;
}
function render(){
 const records=getRecords();
 document.getElementById("total").textContent=records.length;
 document.getElementById("unique").textContent=
  new Set(records.map(x=>x.visitorKey)).size;
 const el=document.getElementById("records");
 if(!records.length){el.textContent="暂无访问记录";return}
 el.innerHTML=records.slice().reverse().map(x=>
  '<div class="item"><b>'+escapeHTML(x.label)+'</b><br>'+
  '<small>'+new Date(x.time).toLocaleString()+
  ' · '+escapeHTML(x.device)+'</small><br>'+
  '<small>来源：'+escapeHTML(x.referrer)+'</small><br>'+
  '<small>浏览器：'+escapeHTML(x.browser)+'</small><br>'+
  '<a href="'+escapeHTML(x.post)+'" target="_blank">查看原帖</a></div>'
 ).join("");
}
function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}
function exportData(){
 const rows=getRecords();
 if(!rows.length){alert("暂无数据");return}
 const cols=["label","post","time","device","browser","referrer"];
 const csv=[cols.join(","),...rows.map(r=>
  cols.map(c=>'"'+String(r[c]||"").replace(/"/g,'""')+'"').join(",")
 )].join("\n");
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],
  {type:"text/csv;charset=utf-8"}));
 a.download="visitor-records.csv";
 a.click();
 URL.revokeObjectURL(a.href);
}
function clearData(){
 if(confirm("确定清空本浏览器的所有记录？")){
  saveRecords([]);render();
 }
}
track();
render();
</script>
</body>
</html>
